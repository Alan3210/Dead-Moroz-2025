<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body { 
        width: 100%; 
        height: 100%; 
        padding: 0; 
        margin: 0; 
        overflow: hidden; 
        background: #111; 
      }
      #unity-container { 
        width: 100%; 
        height: 100%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        position: relative;
      }
      #unity-canvas { 
        background: #231F20; 
      }
      #loading-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        font-size: 24px;
        cursor: pointer;
        z-index: 10;
      }
      #loading-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        z-index: 20;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid #fff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка... 0%</div>
      </div>
      <div id="loading-overlay" style="display:none;">Нажми, чтобы начать</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var overlay = document.querySelector("#loading-overlay");
      var loadingScreen = document.querySelector("#loading-screen");
      var loadingText = document.querySelector("#loading-text");

      // Robust JS Resizer to prevent 0x0 errors
      function resize() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        var aspect = 9 / 16;

        if (w / h > aspect) {
          w = h * aspect;
        } else {
          h = w / aspect;
        }

        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }

      window.addEventListener('resize', resize);
      resize(); // Initial sizing

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: window.devicePixelRatio,
      }, (progress) => {
        loadingText.innerHTML = "Загрузка... " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        console.log("Unity loaded successfully");
        loadingScreen.style.display = "none";
        
        // Telegram Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            console.log("Telegram WebApp Initialized");
        }

        overlay.style.display = "flex";
        overlay.onclick = () => {
          overlay.style.display = "none";
          // Resume audio context if needed, though interaction usually handles it
        };
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
