<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>2025</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body { 
        width: 100%; 
        height: 100%; 
        padding: 0; 
        margin: 0; 
        overflow: hidden; 
        background: #111; 
      }
      #unity-container { 
        width: 100%; 
        height: 100%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        position: relative;
      }
      #unity-canvas { 
        background: #231F20; 
      }
      #loading-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        font-size: 24px;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
      <div id="loading-overlay" style="display:none;">Tap to Start</div>
    </div>
    <script src="Build/WebGLBuild.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var overlay = document.querySelector("#loading-overlay");

      // Robust JS Resizer to prevent 0x0 errors
      function resize() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        var aspect = 9 / 16;

        if (w / h > aspect) {
          w = h * aspect;
        } else {
          h = w / aspect;
        }

        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }

      window.addEventListener('resize', resize);
      resize(); // Initial sizing

      createUnityInstance(canvas, {
        dataUrl: "Build/WebGLBuild.data",
        frameworkUrl: "Build/WebGLBuild.framework.js",
        codeUrl: "Build/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Goida Games",
        productName: "2025",
        productVersion: "1",
        devicePixelRatio: window.devicePixelRatio,
      }).then((unityInstance) => {
        console.log("Unity loaded successfully");
        
        // Telegram Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            console.log("Telegram WebApp Initialized");
        }

        overlay.style.display = "flex";
        overlay.onclick = () => {
          overlay.style.display = "none";
          // Resume audio context if needed, though interaction usually handles it
        };
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
